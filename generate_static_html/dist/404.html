<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <title>404 — Strona nie znaleziona</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #f8f9fa;
      color: #333;
    }
    .container { text-align: center; padding: 2rem; }
    h1 { font-size: 4rem; color: #dee2e6; margin-bottom: 0.5rem; }
    p { font-size: 1.1rem; color: #666; margin-bottom: 1.5rem; }
    a {
      display: inline-block;
      padding: 0.6rem 1.5rem;
      background: #228be6;
      color: #fff;
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.95rem;
    }
    a:hover { background: #1c7ed6; }
  </style>
</head>
<body>
  <div class="container">
    <h1>404</h1>
    <p>Strona baterii nie została znaleziona.<br>
       <small>Battery page not found.</small></p>
    <p style="font-size: 0.85rem; color: #999;">
      Sprawdź kod QR lub URL.<br>
      Check the QR code or URL.
    </p>
  </div>
</body>
</html>
